name: Publish

# Publishes to PyPI when a GitHub Release is published for a tag vX.Y.Z.
#
# Authentication is PyPI trusted publishing (OIDC): PyPI trusts this
# workflow, in this repository, in the `pypi` environment. There is no API
# token to store or rotate. One-time setup, on pypi.org under the project's
# Publishing settings (or as a "pending publisher" before the first release):
#
#   Owner:        gyldendalsolutions
#   Repository:   internetbook_analysis   (the PyPI project is internetbook-analysis)
#   Workflow:     publish.yaml
#   Environment:  pypi
#
# scripts/release.sh remains the manual fallback (twine with ~/.pypirc, as
# for systime-stackapi). skip-existing below makes a release harmless when
# that version was already uploaded by hand.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag must match the package version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/internetbook_analysis/__init__.py)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Release tag $TAG does not match __version__ $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tagged commit must be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release from main only"
            exit 1
          fi

  test:
    needs: verify
    uses: ./.github/workflows/test.yaml

  build:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Built version matches the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls dist
          test -f "dist/internetbook_analysis-${VERSION}-py3-none-any.whl"
          test -f "dist/internetbook_analysis-${VERSION}.tar.gz"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Protect this environment in the repository settings (required
    # reviewers, deployment branches/tags v*) to gate every upload.
    environment:
      name: pypi
      url: https://pypi.org/project/internetbook-analysis/${{ needs.verify.outputs.version }}/
    permissions:
      # Only this job can obtain the OIDC token PyPI trusts; the build above
      # never holds publishing credentials.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
